name: Build Cubve

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize each branch so the next build observes the previous release tag.
concurrency:
  group: cubve-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      filename: ${{ steps.plan.outputs.filename }}
      artifact: cubve-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Plan version without creating a tag
        id: plan
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'LunaStev/Cubve' }}
        run: |
          args=()
          if [[ "$RELEASE_BUILD" == "true" ]]; then args+=(--release); fi
          python3 scripts/release.py plan "${args[@]}" --output release-plan.json --github-output "$GITHUB_OUTPUT"
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            patch=$(python3 -c 'import json; print(json.load(open("release-plan.json"))["patch"])')
            echo "BUILD_NUMBER=$patch" >> "$GITHUB_ENV"
          fi
          echo "BUILD_STARTED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          git config user.name "Cubve CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace
      - name: Verify maintenance and release rules
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check and package
        run: ./gradlew check createPaperclipJar --stacktrace
      - name: Prepare verified runnable distribution
        run: python3 scripts/release.py package --plan release-plan.json --directory dist
      - uses: actions/upload-artifact@v7
        with:
          name: cubve-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/checkstyle/*.xml
          if-no-files-found: ignore

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Check checksum and execute the exact distribution JAR
        run: python3 scripts/release.py smoke --directory dist

  release:
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'LunaStev/Cubve' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Publish JAR and checksum after every verification job passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --directory dist
