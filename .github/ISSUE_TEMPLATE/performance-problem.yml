name: Performance problem
description: Report a reproducible performance problem in Cubve.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed behavior and the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or use case
      description: Include the steps, affected plugins and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Cubve version
      description: Paste the output of /version, including the commit and Minecraft version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Include relevant logs or a spark profile for performance problems. Remove private information before sharing.
